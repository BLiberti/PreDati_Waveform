# config.yaml
# Versione: v10
# Data ultima modifica: 2026-09-07
# Descrizione: Configurazione con polarità segnale per efficienza corretta

# Configurazione Analisi Forme d'Onda
directory_principale: /mnt/hgfs/D/PreDati_Waveform/RCiccione/Cil00-Prima

# Numero di canali
num_canali: 3

# Formato file dati
formato_dati: text  # oppure 'binary'

# Sottodirectory con parametri
sottodirectory:
  - 4500-1 4500 26.5 1007
  - 4600-1 4600 26.5 1007  
  - 4700-1 4700 26.5 1007
  - 4800-1 4800 26.5 1006  
  - 4900-1 4900 26.5 1006
  - 5000-1 5000 26.5 1006
  - 5100-1 5100 26.5 1006
  - 5200-1 5200 26.5 1006
  - 5300-1 5300 26.5 1006
  - 5400-1 5400 27.0 1006
  - 5500-1 5500 26.5 1006
  - 5600-1 5600 26.5 1006
  - 5700-1 5700 27.0 1006
  - 5800-1 5800 27.0 1006

# Intervalli temporali per ogni canale (in secondi)
intervalli_temporali:
  canale_1:
    t0: -0.000000100
    tinf: -0.000000090
    tsup: 0.000000000
  canale_2:
    t0: -0.000000100
    tinf: -0.000000090
    tsup: 0.000000000
  canale_3:
    t0: -0.000000100
    tinf: -0.000000090
    tsup: -0.000000060

# Polarità segnale per ogni canale
# "positive": picco verso l'alto (vmax > 0)
# "negative": picco verso il basso (vmin < 0)
polarita:
  canale_1: negative
  canale_2: negative
  canale_3: negative

# Soglie di efficienza per ogni canale (valori assoluti)
# La polarità viene applicata automaticamente nel calcolo
soglie_efficienza:
  canale_1:
    soglia_V: 0.200  # 200 mV
    soglia_Q: 0.000000001  # 1 nC
  canale_2:
    soglia_V: 0.200  # 200 mV
    soglia_Q: 0.000000001  # 1 nC
  canale_3:  # RCCione Single strip
    soglia_V: 0.0015  # 1.5 mV
    soglia_Q: 0.000000000002  # 2 pC

# Impedenza di ingresso per ogni canale (Ohm)
impedenza:
  canale_1: 50.0
  canale_2: 50.0
  canale_3: 50.0

# Parametri ROOT
root_output: output_analisi.root
